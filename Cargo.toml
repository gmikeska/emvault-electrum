[package]
name = "emvault-electrum"
version = "0.5.0"
edition = "2024"
description = "Production, descriptor-private electrs/Electrum chain backend for EmVault (BDK) wallets: BDK sync/broadcast plus a scripthash watch/unwatch layer."
license = "MIT OR Apache-2.0"
repository = "https://github.com/gmikeska/emvault-electrum"
readme = "README.md"

[dependencies]
# Same pins as emvault-esplora so wallet/tx types unify across the ecosystem.
bdk_wallet = "3.1.0"
bitcoin = "0.32.10"
# BDK↔Electrum sync adapter. Wraps `electrum-client` and re-exports it as
# `bdk_electrum::electrum_client` — our single source for the watch surface
# (Q2). Version chosen to match bdk_wallet 3.1 / bdk_core 0.6.
bdk_electrum = { version = "0.23.0", default-features = false, features = ["use-rustls-ring"] }
thiserror = "2"
hex = "0.4"
# Async facade + worker-thread channels for the watch layer (Q3).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
